name: Update Clash Subscription

on:
  workflow_dispatch:

  schedule:
    # 每天北京时间 00:00 和 12:00 (对应 UTC 16:00 和 04:00) 运行
    - cron: '0 16 * * *'
    - cron: '0 4 * * *'

env:
  TZ: 'Asia/Shanghai'

concurrency:
  group: update-subscription
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          #cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # PySocks 对 socks5 代理测试必不可少
          pip install requests pyyaml tqdm PySocks psutil urllib3

      # ==================== 内核准备 ====================
      - name: Cache Xray core
        id: cache-xray
        uses: actions/cache@v4
        with:
          path: v2ray
          key: xray-core-${{ runner.os }}-v24.9.30

      - name: Download Xray core (As v2ray)
        if: steps.cache-xray.outputs.cache-hit != 'true'
        run: |
          echo "📥 下载 Xray 核心 (全面支持 VLESS Reality)..."
          # 使用 Xray 替代原版 v2ray，保持命令行兼容
          curl -sL -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q xray.zip xray
          mv xray v2ray
          rm -f xray.zip
          chmod +x v2ray

      - name: 下载 mihomo (Clash.Meta) 核心
        run: |
          echo "📥 获取最新的 mihomo release 链接..."
          # 加入 GITHUB_TOKEN 防止匿名调用 API 被限流 (403 rate limit exceeded)
          MIHOMO_URL=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" \
            | jq -r '.assets[] | select(.name | test("mihomo-linux-amd64-compatible-.*\\.gz$")) | .browser_download_url' | head -n 1)

          # 如果找不到 compatible 版，回退到普通 amd64 版
          if [ -z "$MIHOMO_URL" ] || [ "$MIHOMO_URL" = "null" ]; then
            MIHOMO_URL=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" \
              | jq -r '.assets[] | select(.name | test("mihomo-linux-amd64-v.*\\.gz$")) | .browser_download_url' | head -n 1)
          fi

          if [ -z "$MIHOMO_URL" ] || [ "$MIHOMO_URL" = "null" ]; then
            echo "❌ 错误：无法通过 API 解析到 mihomo 下载链接！"
            exit 1
          fi

          echo "下载地址: $MIHOMO_URL"
          wget -q -O mihomo.gz "$MIHOMO_URL"
          gzip -d mihomo.gz
          mv mihomo clash
          chmod +x clash

      - name: 验证测试核心
        run: |
          echo ">>> 检查内核就绪状态:"
          chmod +x v2ray clash || true
          ./clash -v
          ./v2ray version

      # ==================== 执行测试 ====================
      - name: Run subscription update script
        run: python update_subs.py

      - name: Check generated files
        run: |
          echo "检查生成的文件..."
          ls -la sub.yaml sub_scholar.yaml update_time.txt 2>/dev/null || true
          if [ -f sub.yaml ]; then
            echo "sub.yaml 内容预览:"
            head -n 20 sub.yaml
            echo "sub.yaml 大小: $(wc -c < sub.yaml) 字节"
          else
            echo "⚠️ sub.yaml 未生成！可能所有节点在真实连接测试中均未存活。"
          fi

      - name: Generate statistics
        run: |
          cat > STATS.md << EOF
          # 订阅统计

          ## 更新信息
          - 更新时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          - 运行编号: ${{ github.run_number }}
          - 触发方式: ${{ github.event_name }}

          ## 节点信息
          EOF

          if [ -f sub.yaml ]; then
            # 仅统计 proxies 块下的节点行（排除 PROXY/AUTO/FALLBACK 等策略组）
            NODE_COUNT=$(grep -E '^\s+- \{name:' sub.yaml 2>/dev/null | wc -l)
            if [ "$NODE_COUNT" -eq 0 ]; then
              NODE_COUNT=$(grep -E '^\s+- name:' sub.yaml 2>/dev/null | grep -vE 'PROXY|AUTO|FALLBACK' | wc -l || echo 0)
            fi
            echo "- 通用可用节点数: $NODE_COUNT" >> STATS.md
          fi

          if [ -f sub_scholar.yaml ]; then
            SCHOLAR_COUNT=$(grep -E '^\s+- \{name:' sub_scholar.yaml 2>/dev/null | wc -l)
            if [ "$SCHOLAR_COUNT" -eq 0 ]; then
              SCHOLAR_COUNT=$(grep -E '^\s+- name:' sub_scholar.yaml 2>/dev/null | grep -vE 'PROXY|AUTO|FALLBACK' | wc -l || echo 0)
            fi
            echo "- Scholar 纯净节点数: $SCHOLAR_COUNT" >> STATS.md
          fi

          if [ -f update_time.txt ]; then
            echo "" >> STATS.md
            echo "## 详细信息" >> STATS.md
            echo '```' >> STATS.md
            cat update_time.txt >> STATS.md
            echo '```' >> STATS.md
          fi

          cat STATS.md

      # ==================== 提交推送 ====================
      - name: Commit and push changes
        run: |
          # 🚨【关键防爆】：在执行 git add 前必须彻底清理掉二进制文件与解压残留，禁止提交到仓库！
          rm -f clash v2ray mihomo.gz xray.zip *.zip *.gz /tmp/v2ray_* /tmp/clash_* 2>/dev/null || true

          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # 只追踪添加配置文件与状态文档
          git add sub.yaml sub_scholar.yaml sub_v2ray_base64*.txt update_time.txt STATS.md test.log 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "无有效更改，跳过 commit"
          else
            BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
            echo "当前提交分支: $BRANCH_NAME"

            git commit -m "feat: 自动更新订阅文件 [skip ci]" \
                       -m "更新时间: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

            for i in 1 2 3; do
              git pull --rebase origin "$BRANCH_NAME" && git push origin "$BRANCH_NAME" && break
              echo "⚠️ 推送冲突，第 $i 次重试..."
              sleep $((i * 5))
            done
            echo "✅ 订阅更新成功推送！"
          fi
