name: Update Clash Subscription

on:
  workflow_dispatch:

  # 设置定时任务，使用 cron 语法
  # '0 */6 * * *' 表示每隔 24 小时执行一次 (在 0 分, 每 6 小时)
  # schedule:
  #   - cron: '0 */6 * * *'
  schedule:
    - cron: '0 16 * * *'
    - cron: '0 4 * * *'

env:
  TZ: 'Asia/Shanghai'  # 设置时区为北京时间

concurrency:
  group: update-subscription
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml tqdm PySocks ping3 psutil

      - name: Cache V2ray core
        id: cache-v2ray
        uses: actions/cache@v4
        with:
          path: v2ray
          key: v2ray-core-v5.20.0-${{ runner.os }}
          
      - name: Download V2ray core
        if: steps.cache-v2ray.outputs.cache-hit != 'true'
        run: |
          echo "📥 下载V2ray核心..."
          V2RAY_VERSION="v5.20.0"
          wget -q https://github.com/v2fly/v2ray-core/releases/download/${V2RAY_VERSION}/v2ray-linux-64.zip
          unzip -q v2ray-linux-64.zip v2ray
          chmod +x v2ray
          ./v2ray version

      - name: 下载 mihomo (Clash.Meta) 核心
        run: |
          # 1. 自动获取最新的版本号
          LATEST_TAG=$(curl -sL "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" | jq -r ".tag_name")
          
          if [ -z "$LATEST_TAG" ]; then
            echo "错误：无法获取最新的 mihomo 版本号！"
            exit 1
          fi
          
          echo "最新的 mihomo 版本是: $LATEST_TAG"
          
          # 2. 构建下载链接 (GitHub Actions 使用 linux-amd64 架构)
          DOWNLOAD_URL="https://github.com/MetaCubeX/mihomo/releases/download/${LATEST_TAG}/mihomo-linux-amd64-${LATEST_TAG}.gz"
          
          echo "正在从 ${DOWNLOAD_URL} 下载 mihomo 核心..."
          wget -q -O mihomo.gz "${DOWNLOAD_URL}"
          
          # 3. 解压核心文件
          echo "解压核心文件..."
          gzip -d mihomo.gz
          
          # 4. 将解压出的核心文件重命名为 'clash'，并赋予执行权限
          # Python 脚本将通过 './clash' 调用它
          mv mihomo clash
          chmod +x ./clash
          
          echo "mihomo 核心准备就绪:"
          ./clash -v

      - name: Run subscription update script
        run: python update_subs.py

      - name: Check generated files  # 调试文件生成
        run: |
          echo "检查生成的文件..."
          ls -la sub.yaml update_time.txt || echo "文件未生成或路径错误"
          if [ -f sub.yaml ]; then
            echo "sub.yaml 内容预览:"
            head -n 20 sub.yaml  # 只显示前20行，避免日志过长
            echo "sub.yaml 大小: $(wc -c < sub.yaml) 字节"
            if [ $(wc -l < sub.yaml) -gt 10 ]; then
              echo "文件非空，生成成功"
            else
              echo "文件可能为空，检查代码日志"
            fi
          else
            echo "sub.yaml 未生成！可能原因: 订阅解析失败、测试无有效节点或代码异常"
          fi
          cat update_time.txt || echo "update_time.txt 未生成"

      - name: Generate statistics
        run: |
          cat > STATS.md << EOF
          # 订阅统计

          ## 更新信息
          - 更新时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          - 运行编号: ${{ github.run_number }}
          - 触发方式: ${{ github.event_name }}

          ## 节点信息
          EOF

          if [ -f sub.yaml ]; then
            NODE_COUNT=$(grep -c 'name:' sub.yaml || echo 0)
            echo "- 可用节点数: $NODE_COUNT" >> STATS.md
          fi

          if [ -f update_time.txt ]; then
            echo "" >> STATS.md
            echo "## 详细信息" >> STATS.md
            echo '```' >> STATS.md
            cat update_time.txt >> STATS.md
            echo '```' >> STATS.md
          fi

          cat STATS.md

      # 提交并推送更改
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff-index --quiet HEAD; then
            echo "无更改，跳过 commit"
          else
            git commit -m "feat: 自动更新订阅文件" \
                       -m "更新时间: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" \
                       -m "[skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              echo "⚠️ 第 $i 次重试..."
              sleep $((i * 5))
            done
            echo "✅ 已推送更新"
          fi
