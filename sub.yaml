port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
unified-delay: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  fake-ip-range: 198.18.0.1/16
  nameserver:
  - https://doh.pub/dns-query
  - https://223.5.5.5/dns-query
  fallback:
  - 8.8.8.8
  - 1.1.1.1
  - tls://dns.google
proxies: []
proxy-groups:
- name: PROXY
  type: select
  proxies:
  - AUTO-URL
  - DIRECT
- name: AUTO-URL
  type: url-test
  proxies: []
  url: http://cp.cloudflare.com/generate_204
  interval: 300
rules:
- GEOIP,CN,DIRECT
- MATCH,PROXY
