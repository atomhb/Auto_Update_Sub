port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
dns:
  enabled: true
  enhanced-mode: fake-ip
  nameserver:
  - https://doh.pub/dns-query
  - https://223.5.5.5/dns-query
  fallback:
  - 8.8.8.8
  - 1.1.1.1
proxies: []
proxy-groups:
- name: PROXY
  type: select
  proxies:
  - DIRECT
rules:
- DOMAIN-SUFFIX,scholar.google.com,PROXY
- DOMAIN-SUFFIX,google.com,PROXY
- GEOIP,CN,DIRECT
- MATCH,PROXY
