port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
dns:
  enabled: true
  enhanced-mode: fake-ip
  nameserver:
  - https://doh.pub/dns-query
  - https://223.5.5.5/dns-query
  fallback:
  - 8.8.8.8
  - 1.1.1.1
proxies:
- name: '[OpenRay] 🇺🇸 US-11244'
  type: vless
  server: 40.160.6.133
  port: 8880
  uuid: 6251f84e-9c02-4140-921c-6b47d394fb96
  network: grpc
  tls: false
  udp: true
  skip-cert-verify: false
- name: '[OpenRay] 🇨🇦 CA-14360'
  type: vless
  server: 104.16.0.108
  port: 443
  uuid: aaaaaabb-4ddd-4eee-9fff-ffffffffffff
  network: ws
  tls: true
  servername: afrcloud22.mmv.kr
  ws-opts:
    path: /5.223.47.32=443
    headers:
      Host: afrcloud22.mmv.kr
  udp: true
  skip-cert-verify: false
- name: '[OpenRay] 🇺🇸 US-12617'
  type: vless
  server: 185.186.245.40
  port: 81
  uuid: 6202b230-417c-4d8e-b624-0f71afa9c75d
  network: ws
  tls: true
  servername: sni.111000.dynv6.net
  ws-opts:
    path: /?ed=2560&Telegram🇨🇳 @WangCai2
    headers:
      Host: sni.111000.dynv6.net
  udp: true
  skip-cert-verify: false
proxy-groups:
- name: PROXY
  type: select
  proxies:
  - AUTO
  - '[OpenRay] 🇺🇸 US-11244'
  - '[OpenRay] 🇨🇦 CA-14360'
  - '[OpenRay] 🇺🇸 US-12617'
- name: AUTO
  type: url-test
  proxies:
  - '[OpenRay] 🇺🇸 US-11244'
  - '[OpenRay] 🇨🇦 CA-14360'
  - '[OpenRay] 🇺🇸 US-12617'
  url: http://www.gstatic.com/generate_204
  interval: 300
rules:
- DOMAIN-SUFFIX,scholar.google.com,PROXY
- DOMAIN-SUFFIX,google.com,PROXY
- GEOIP,CN,DIRECT
- MATCH,PROXY
