port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
dns:
  enabled: true
  enhanced-mode: fake-ip
  nameserver:
  - https://doh.pub/dns-query
  - https://223.5.5.5/dns-query
  fallback:
  - 8.8.8.8
  - 1.1.1.1
proxies:
- name: '[OpenRay] 🇨🇦 CA-16769'
  type: vless
  server: 104.16.140.242
  port: 443
  uuid: 6fb65356-788e-4118-8280-148ec6eca18a
  network: ws
  tls: true
  servername: xn--cz8h.pages.dev
  client-fingerprint: random
  ws-opts:
    path: pyip=proxyip.cmliussss.net
    headers:
      Host: xn--cz8h.pages.dev
  udp: true
  skip-cert-verify: false
proxy-groups:
- name: PROXY
  type: select
  proxies:
  - AUTO
  - '[OpenRay] 🇨🇦 CA-16769'
- name: AUTO
  type: url-test
  proxies:
  - '[OpenRay] 🇨🇦 CA-16769'
  url: http://www.gstatic.com/generate_204
  interval: 300
rules:
- DOMAIN-SUFFIX,scholar.google.com,PROXY
- DOMAIN-SUFFIX,google.com,PROXY
- GEOIP,CN,DIRECT
- MATCH,PROXY
