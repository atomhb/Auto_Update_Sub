port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
dns:
  enabled: true
  enhanced-mode: fake-ip
  nameserver:
  - https://doh.pub/dns-query
  - https://223.5.5.5/dns-query
  fallback:
  - 8.8.8.8
  - 1.1.1.1
proxies:
- name: '[OpenRay] Dynamic-11585'
  type: vless
  server: mianfeijiedianscp.buzz
  port: 443
  uuid: 0b3ad86e-1818-49bb-949d-4e85d137a16d
  network: ws
  tls: true
  ws-opts:
    path: /
    headers:
      Host: mianfeijiedianscp.buzz
  udp: true
  skip-cert-verify: false
proxy-groups:
- name: PROXY
  type: select
  proxies:
  - AUTO
  - '[OpenRay] Dynamic-11585'
- name: AUTO
  type: url-test
  proxies:
  - '[OpenRay] Dynamic-11585'
  url: http://www.gstatic.com/generate_204
  interval: 300
rules:
- DOMAIN-SUFFIX,scholar.google.com,PROXY
- DOMAIN-SUFFIX,google.com,PROXY
- GEOIP,CN,DIRECT
- MATCH,PROXY
